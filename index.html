<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">

                <i class="bi bi-wallet2"></i>

                Expense Tracker

            </a>

        </div>

    </nav>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <div class="container my-5">


        <!-- Heading -->

        <div class="text-center mb-5">

            <h1>Personal Expense Tracker</h1>

            <p class="text-muted">
                Manage your income and expenses easily
            </p>

        </div>



        <!-- ========================= -->
        <!-- BALANCE CARDS -->
        <!-- ========================= -->

        <div class="row g-3 mb-4">


            <!-- Balance -->

            <div class="col-md-4">

                <div class="card text-center shadow-sm">

                    <div class="card-body">

                        <h5>Total Balance</h5>

                        <h2 id="balance">
                            ₹0.00
                        </h2>

                    </div>

                </div>

            </div>



            <!-- Income -->

            <div class="col-md-4">

                <div class="card text-center shadow-sm">

                    <div class="card-body">

                        <h5>Total Income</h5>

                        <h2
                            id="income"
                            class="text-success"
                        >
                            ₹0.00
                        </h2>

                    </div>

                </div>

            </div>



            <!-- Expense -->

            <div class="col-md-4">

                <div class="card text-center shadow-sm">

                    <div class="card-body">

                        <h5>Total Expense</h5>

                        <h2
                            id="expense"
                            class="text-danger"
                        >
                            ₹0.00
                        </h2>

                    </div>

                </div>

            </div>

        </div>



        <!-- ========================= -->
        <!-- ADD / EDIT TRANSACTION -->
        <!-- ========================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">


                <h4 class="mb-4">
                    Add Transaction
                </h4>


                <form id="transactionForm">


                    <div class="row g-3">


                        <!-- Description -->

                        <div class="col-md">

                            <label class="form-label">
                                Description
                            </label>

                            <input
                                type="text"
                                id="description"
                                class="form-control"
                                placeholder="e.g. Grocery"
                                required
                            >

                        </div>



                        <!-- Amount -->

                        <div class="col-md">

                            <label class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                placeholder="₹ Amount"
                                min="0.01"
                                step="0.01"
                                required
                            >

                        </div>



                        <!-- Type -->

                        <div class="col-md">

                            <label class="form-label">
                                Type
                            </label>

                            <select
                                id="type"
                                class="form-select"
                            >

                                <option value="expense">
                                    Expense
                                </option>

                                <option value="income">
                                    Income
                                </option>

                            </select>

                        </div>



                        <!-- Category -->

                        <div class="col-md">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                            >

                                <option>Food</option>

                                <option>Transport</option>

                                <option>Shopping</option>

                                <option>Education</option>

                                <option>Entertainment</option>

                                <option>Salary</option>

                                <option>Other</option>

                            </select>

                        </div>



                        <!-- Date -->

                        <div class="col-md">

                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="date"
                                class="form-control"
                                required
                            >

                        </div>


                    </div>



                    <!-- Submit Button -->

                    <button
                        type="submit"
                        id="submitBtn"
                        class="btn btn-primary mt-4"
                    >

                        <i class="bi bi-plus-circle"></i>

                        Add Transaction

                    </button>


                </form>

            </div>

        </div>



        <!-- ========================= -->
        <!-- TRANSACTION HISTORY -->
        <!-- ========================= -->

        <div class="card shadow-sm">

            <div class="card-body">


                <!-- History Header + Controls -->

                <div
                    class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
                >


                    <h4 class="mb-0">
                        Transaction History
                    </h4>



                    <div
                        class="d-flex flex-wrap gap-2"
                    >


                        <!-- Search -->

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            style="max-width: 220px;"
                            placeholder="Search transactions..."
                        >



                        <!-- Filter -->

                        <select
                            id="filterType"
                            class="form-select w-auto"
                        >

                            <option value="all">
                                All Transactions
                            </option>

                            <option value="income">
                                Income Only
                            </option>

                            <option value="expense">
                                Expense Only
                            </option>

                        </select>


                        <!-- Month Filter -->
                        <input
                            type="month"
                            id="monthFilter"
                            class="form-control"
                            style="width: auto;"
                        >
                        <!-- Sort -->

                        <select
                            id="sortType"
                            class="form-select w-auto"
                        >

                            <option value="newest">
                                Newest First
                            </option>

                            <option value="oldest">
                                Oldest First
                            </option>

                        </select>



                        <!-- Clear All -->

                        <button
                            id="clearAllBtn"
                            class="btn btn-outline-danger"
                            type="button"
                        >

                            <i class="bi bi-trash3"></i>

                            Clear All

                        </button>


                    </div>

                </div>



                <!-- ========================= -->
                <!-- TRANSACTION TABLE -->
                <!-- ========================= -->

                <div class="table-responsive">

                    <table class="table table-hover">


                        <thead>

                            <tr>

                                <th>
                                    Description
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Type
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="transactionList">

                            <!--
                                Transactions are added
                                automatically by JavaScript
                            -->

                        </tbody>


                    </table>

                </div>


            </div>

        </div>


    </div>



    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>


</body>

</html>
